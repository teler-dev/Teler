<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1a" />
    <link rel="icon" type="image/x-icon" href="/teler.ico" />

    <script>
      (function () {
        try {
          var key = 'teler_theme_mode';
          var saved = localStorage.getItem(key);
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : mode;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themeMode = mode;
          root.style.colorScheme = resolved;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', resolved === 'light' ? '#f8fafc' : '#0a0f1a');
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.themeMode = 'system';
        }
      })();
    </script>

    <style>
      :root[data-theme="dark"] { --boot-page: #0a0f1a; --boot-text: #f1f5f9; }
      :root[data-theme="light"] { --boot-page: #f8fafc; --boot-text: #0f172a; }
      html, body, #root { min-height: 100%; background: var(--boot-page); color: var(--boot-text); }
      body { margin: 0; font-family: "Inter", sans-serif; overflow-x: hidden; }
      h1,h2,h3,h4,h5,h6 { font-family: "Space Grotesk", sans-serif; }
      .glow-text { text-shadow: 0 0 20px rgba(19,214,255,.5); }
      .grid-bg {
        background-image: linear-gradient(rgba(19,214,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(19,214,255,.03) 1px,transparent 1px);
        background-size: 40px 40px;
      }
      .duplicate-frame { border:2px dashed rgba(255,255,255,.10)!important; cursor:default!important; }
      .duplicate-frame:hover { transform:none!important; box-shadow:none!important; z-index:auto!important; }
      .duplicate-frame-badge { font-size:8px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:999px;line-height:1; }
    </style>
